title = "AIOS gitleaks config"

# CI 시크릿 스캔(quality.yml "Secret scan") 설정. 기본 규칙셋은 그대로
# 쓰고, 로컬로 미리 스캔해 확인한 알려진 오탐만 허용목록에 올린다
# (2026-09-02 확인 — docs/RED_TEAM_FINDINGS.md #10 이후 도입).

[extend]
useDefault = true

# PLT-39(2026-09-03): 기본 규칙셋은 일반 API key/hex 패턴만 잡는다. AIOS
# 고유 자격증명 형식(64자 hex 대칭키, 거래소 key:secret 환경변수)은 별도
# 규칙으로 명시해야 실수 커밋을 잡는다. 근거: src/core/security/key_ring.py
# (`CREDENTIAL_ENCRYPTION_KEYS_{PAPER,LIVE}` = `kid:hex64` 콤마 목록,
# 32바이트=hex 64자 강제)와 .env.example의 거래소 자격증명 변수명.
[[rules]]
id = "aios-credential-encryption-keys"
description = "AIOS CREDENTIAL_ENCRYPTION_KEYS_{PAPER,LIVE} — kid:64자리 hex AES-256 키"
regex = '''CREDENTIAL_ENCRYPTION_KEYS_(PAPER|LIVE)\s*=\s*[A-Za-z0-9_-]+:[0-9a-fA-F]{64}'''
tags = ["credential", "aios"]

[[rules]]
id = "aios-exchange-credentials"
description = "AIOS 거래소 API key/secret 환경변수(BITGET/KIS/NH)"
regex = '''(BITGET_API|KIS_APP|NH_APP)_(KEY|SECRET)[ \t]*=[ \t]*[A-Za-z0-9+/_.-]{16,}'''
tags = ["credential", "exchange", "aios"]

[allowlist]
description = "알려진 오탐 — 실제 자격증명이 아닌 테스트 픽스처·참조 문자열·빈 값"
# 2026-09-08: 허용 정규식을 잡힌 조각이 아니라 줄 전체에 대조한다. generic-api-key가
# f"fill:{uuid4().hex}:{i}" 같은 f-string에서 잘라 낸 조각에는 위 정규식이 닿지 않았다.
regexTarget = "line"
paths = [
  # AES 라운드트립 자체의 정확성만 검증하는 테스트라 key/iv가 알파벳
  # 나열 placeholder다("abcdefghijklmnop1234567890ABCDEF") — 실제
  # KIS 서버와 통신하지 않는다(파일 docstring 참조).
  '''tests/unit/exchanges/test_kis_ws_messages\.py''',
  # 2026-09-08 Actions 첫 완주 적발분. 아래 셋은 파일의 목적 자체가 시크릿 모양 문자열의
  # 마스킹·참조 판별이라 실제 같은 픽스처가 불가피하다(JWT·sk_live_ 등).
  '''tests/unit/core/logging/test_redaction\.py''',
  '''tests/unit/core/security/test_secret_ref\.py''',
  '''frontend/packages/shared-types/src/secretRef\.test\.ts''',
  # 반입한 서드파티(KLineChart, Apache-2.0). 우리가 작성하지 않으며 hotkey 'keys:' 문자열이 오탐된다.
  '''frontend/packages/chart-engine/vendor/''',
]
regexes = [
  # 2026-09-08(Actions 결제 해제 후 첫 완주에서 적발): 테스트 픽스처의 명백한 가짜 토큰.
  # 값 자체에 fixture/dummy/fake/placeholder가 들어간 저엔트로피 문자열만 허용한다 —
  # 경로 단위 허용은 tests/ 전체의 실수 커밋을 못 잡게 하므로 쓰지 않는다.
  # 예: tests/contract/exchanges/kis/test_generated_contract.py `"access_token": "tok-br13-fixture"`
  '''\b(tok|token|key|secret|sig)-[A-Za-z0-9-]*(fixture|dummy|fake|placeholder)\b''',
  # src/core/logging/redaction.py의 secret 참조 문자열 — 실제 비밀은
  # KeyRing/vault 뒤에 있고 로그·설정에는 이 참조만 남는다.
  # 회원가입 테스트의 비밀번호 픽스처 'pw' + 숫자 나열, 저널 테스트의 f-string 표현식 — 비밀일 수 없는 형태.
  '''\bpw\d{8,}\b''',
  '''\{uuid4\(\)\.hex\}''',
  '''secref://[A-Za-z0-9_./-]+''',
  # 2026-11-06: Binance 공식 API 문서(HMAC SHA256 signature 예시)에 공개된 예시 비밀키 -- 실제 자격증명이 아니다.
  # tests/exchanges/binance/test_binance_auth.py(task-7600)의 서명 고정 벡터가 문서의 기대 서명과 일치하는지 검증하는 데 쓴다.
  # 경로 단위가 아니라 이 정확한 값 하나만 허용한다 -- 같은 파일에 다른 비밀이 들어오면 여전히 잡힌다.
  '''NhqPtmdSJYdKjVHjA7PZj4Mge3R5YNiP1e3UZjInClVN65XAbvqqM6A7H5fATj0j''',
  # 2026-11-06: Binance WS listenKey 파서 테스트(tests/exchanges/binance/test_binance_websocket.py, task-21977)의
  # 알파벳+숫자 나열 가짜 값. 실제 listenKey는 서버가 발급하는 긴 무작위 문자열이라 12자 placeholder는 비밀일 수 없다.
  # Actions 전체 이력 스캔이 같은 줄을 담은 과거 병합 커밋 3개(지문 6건)에서 잡았다 -- 이 정확한 값 하나만 허용한다.
  '''\babc123def456\b''',
  # 2026-11-11: IdempotencyScope header_key 길이 검증 테스트(tests/unit/api/**/test_restored_deepen.py, 4e7bfaf6a)의
  # 'short…'/'validkey…' 숫자 나열 픽스처 -- 길이 경계(12자/14자/18자)를 재는 값이라 비밀일 수 없다.
  # 경로 단위가 아니라 이 두 접두 형태만 허용한다 -- 같은 파일에 다른 비밀이 들어오면 여전히 잡힌다.
  '''header_key\s*=\s*"(short|validkey)[0-9]{6,}"''',
  # .env.example은 변수명만 나열하고 값은 비워 둔다(실제 키 없음).
  '''(CREDENTIAL_ENCRYPTION_KEY|CREDENTIAL_ENCRYPTION_KEYS_(PAPER|LIVE)|BITGET_API_(KEY|SECRET)|KIS_APP_(KEY|SECRET)|NH_APP_(KEY|SECRET))\s*=\s*(#.*)?$''',
]
