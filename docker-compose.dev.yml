services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aios_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  # Event Bus는 Phase 1 In-process이므로 별도 컨테이너 불필요(05번 원칙)
