[project]
name = "mihwa-aios"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "numpy>=2.0",
    "TA-Lib>=0.6",
    "email-validator>=2.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# task-645(esc-ci-532f4f0f5388): 전체 스위트가 CI 2400s 상한에 걸려 행(hang)
# 지점을 알 수 없이 타임아웃됐다 — 테스트 하나가 무한 대기해도 pytest 프로세스
# 자체는 살아있으므로, per-test 타임아웃을 걸어 그 하나만 실패시키고 스택
# 트레이스를 남긴다("signal" 방식은 SIGALRM이 없는 Windows에서 못 쓰므로
# "thread" 고정 — CI(ubuntu)·로컬(Windows) 동일 동작). 값(120s)은 tests/conftest.py
# retry_too_many_connections 최악 백오프(~31s)와 이 리포의 로컬 공유 Postgres
# 지연 배율을 감안한 여유치이고, perf 마커 테스트는 의도적으로 더 크게 재정의한다
# (아래 tests/conftest.py pytest_collection_modifyitems 참고).
timeout = 120
timeout_method = "thread"
# task-1081(LA-23b, esc-ci-d6f71c240915): 연단위(525,600행) 리플레이 perf
# 테스트가 이 저장소의 공유 CI 환경에서 타임아웃까지 행(hang)해 전체
# pytest를 상시 적색으로 만들었다 — `nightly` 마커 테스트는 기본 실행에서
# 제외하고, nightly 성능 잡이 명시적으로 `pytest -m nightly` 또는
# `--override-ini addopts=` 로 돌린다(ADR-2026-09-04-A §8.4).
addopts = ["-m", "not nightly"]
markers = [
    "perf: 실측 지연시간 단언 — 동시성 부하 테스트와 같은 실행에서 경합하지 않도록 분리 실행한다(task-489/LB-18).",
    "nightly: 실행 시간이 긴 성능 테스트 — 기본 CI에서 제외하고 nightly 잡에서만 돈다(task-1081/ADR-2026-09-04-A).",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID251", "S", "BLE", "ARG", "PGH", "T20"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 Depends()/Query() 등은 인자 기본값에 호출하는 것이 표준 관용구다
# (B008이 일반적인 "가변 기본값" 버그로 오인하는 지점) — 16번대 라우터 전체에서
# 이 패턴을 계속 쓰므로 매번 noqa를 붙이는 대신 여기서 한 번에 허용한다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

# L0-2(docs/specs/L4_market_data_positions_ledger_v1.0.md §9): domain/**는 I/O 순수해야
# 한다. TID251(banned-api)이 정적 분석 단계에서, tests/unit/test_zone_purity.py가 AST로
# 한 번 더(설정 우회·삭제에도 항상 재현되도록) 같은 규칙을 강제한다.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncpg" = { msg = "L0-2: domain/**는 I/O 순수해야 한다 — asyncpg는 adapters/**로 옮길 것" }
"httpx" = { msg = "L0-2: domain/**는 I/O 순수해야 한다 — httpx는 adapters/**로 옮길 것" }
"sqlalchemy" = { msg = "L0-2: domain/**는 I/O 순수해야 한다 — sqlalchemy는 adapters/**로 옮길 것" }

[tool.ruff.lint.per-file-ignores]
# TID251은 기본적으로 모든 소스에 적용된다 — 아래는 실제로 asyncpg/httpx/sqlalchemy가
# 필요한 어댑터·게이트웨이 계층만 예외로 둔다. domain/** 자체를 여기 추가하지 말 것
# (그러면 tests/unit/test_zone_purity.py의 AST 검사만 남아 이중 방어가 무의미해진다).
"src/api/**" = ["TID251"]
"src/core/**" = ["TID251"]
"src/db/**" = ["TID251"]
"src/exchanges/**" = ["TID251"]
"src/foundation/*/adapters/**" = ["TID251"]
"src/foundation/ledger/ports/**" = ["TID251"]
"src/foundation/ledger/application/**" = ["TID251"]
"src/foundation/positions/application/**" = ["TID251"]
"src/foundation/positions/ports/**" = ["TID251"]
"src/foundation/market_data/application/**" = ["TID251"]
"src/foundation/market_data/ports/**" = ["TID251"]
"src/foundation/trust/ports/**" = ["TID251"]
# PLT-28 — MembershipRepository(PLT-27)는 트랜잭션 경계를 호출부가 쥐도록
# 커넥션을 인자로 받는다(ports/membership_repository.py docstring). trust
# domain/**는 여전히 순수하다(test_zone_purity.py가 domain/**만 검사) —
# application/**만 ledger/positions/market_data와 동일하게 예외.
"src/foundation/trust/application/**" = ["TID251"]
"src/main.py" = ["TID251"]
"src/services/*.py" = ["TID251"]
"src/services/execution_loop/**" = ["TID251"]
"src/services/order_service/**" = ["TID251"]
"src/services/oms/ports/**" = ["TID251"]
"src/services/safety/**" = ["TID251"]
"src/watchdog_process.py" = ["TID251"]

# PLT-41 — tests/**: pytest는 assert를 조립(rewrite)해 실패 진단을 만드는
# 프레임워크 관용구이므로 S101(assert 금지)은 대상이 아니다. fixture/mock/
# 콜백은 인터페이스 시그니처를 맞추려고 일부 인자를 쓰지 않는 게 정상이라
# ARG001/002/005도 테스트 존에서는 신호가 아니다. S105/S106/S311은 테스트
# 데이터(더미 자격증명·비암호 난수)이지 실제 비밀/보안 난수가 아니다.
# T201/S603/S607은 통합테스트·perf 벤치마크가 stdout에 결과를 찍거나
# git/psql 등 신뢰된 로컬 커맨드를 실행하는 정상 경로다.
"tests/**" = ["TID251", "S101", "ARG001", "ARG002", "ARG005", "S105", "S106", "S311", "T201", "S603", "S607"]

# PLT-41 — scripts/**: CI/운영 CLI 스크립트는 stdout 출력이 본래 기능이라
# T201(print 금지)의 대상이 아니다. S603/S607은 git/alembic 등 스크립트
# 내부에서 신뢰된 인자로 여는 서브프로세스이고, S314는 pytest-cov가 로컬에
# 생성한 coverage.xml(신뢰된 입력)을 읽는 coverage_ratchet.py 하나뿐이다.
"scripts/**" = ["TID251", "T201", "S603", "S607", "S314"]

# PLT-41 — 아래는 S,BLE,ARG,PGH,T20 확장으로 새로 걸린 위반 중 로직 변경
# 없이는 정리할 수 없는 항목만 파일 단위로 유예한다(동작을 바꾸는 정리는
# task-1092 decision에 따라 금지). 근거는 규칙별로 아래와 같다.
#   S101 — 도메인/어댑터의 방어적 invariant assert. AssertionError를 명시적
#     예외로 바꾸려면 콜사이트마다 예외 타입·메시지·상위 계약을 다시
#     설계해야 해 동작 변경이다.
#   ARG001/ARG002 — FastAPI Depends 인자(인증 게이트 목적으로만 주입되고
#     본문에서는 안 씀)와 Protocol/ABC 구현체가 인터페이스 시그니처를
#     맞추려 안 쓰는 인자. 인자명을 바꾸면 DI/키워드 호출 호환성이 깨질
#     위험이 있어 콜사이트별 검토가 필요하다.
#   S105 — hardcoded-password 휴리스틱 오탐. "PASS"/"SECRET_REFERENCE"/
#     "AUTH_TOKEN_EXPIRED" 등은 실제 자격증명이 아니라 enum·상수 리터럴
#     이름이다(값 자체가 상수 문자열).
#   S608 — SQL 문자열 조합. 실제 인젝션 벡터인지(바인드 파라미터 유무 등)
#     콜사이트마다 확인해야 하고, task-1092 decision이 S608을 정리 금지
#     예시로 명시했다.
#   BLE001 — 광범위 except Exception. task-1092 decision이 정리 금지
#     예시로 명시했다(삼킬지/재던질지는 로직 결정).
#   S110 — try/except/pass. 두 사례 모두 바로 위 줄에 이미 원래 예외를
#     가리지 않기 위한 의도적 삼킴이라는 근거 주석(# noqa: BLE001)이 있어
#     로깅 추가 여부도 그 계약을 다시 따져야 하는 로직 결정이다.
"src/api/contracts/error_codes.py" = ["S105"]
"src/api/contracts/handlers.py" = ["ARG001"]
"src/api/marketplace_deps.py" = ["ARG001"]
"src/api/middleware/request_context.py" = ["S101"]
