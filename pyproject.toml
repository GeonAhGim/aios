"src/core/rate_limit/limiter.py" = ["ARG002"]
"src/core/safety/data_distrust.py" = ["S101"]
"src/core/security/secret_handle.py" = ["S101"]
"src/db/migrations/versions/4a1d0c0de001_db_roles_and_worm_helper.py" = ["S608"]
