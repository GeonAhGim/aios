[project]
name = "mihwa-aios"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "numpy>=2.0",
    "TA-Lib>=0.6",
    "email-validator>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
]
dev = [
    "ruff>=0.16",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI의 Depends()/Query() 등은 인자 기본값에 호출하는 것이 표준 관용구다
# (B008이 일반적인 "가변 기본값" 버그로 오인하는 지점) — 16번대 라우터 전체에서
# 이 패턴을 계속 쓰므로 매번 noqa를 붙이는 대신 여기서 한 번에 허용한다.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
