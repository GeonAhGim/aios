version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # task-5308: vitest 5.x breaks `tsc -b` across ~140 test files — @testing-library/jest-dom's
      # `vitest.d.ts` module augmentation still declares `interface Assertion<T = any>` (one
      # generic), but vitest 5's own `Assertion<R = void, T = unknown>` takes two; the merge fails
      # silently and every jest-dom matcher (toBeInTheDocument, etc.) disappears from the type.
      # Confirmed unfixed even at jest-dom@7.0.1 (latest as of 2026-09-23, predates vitest 5.0.1).
      # Re-allow once jest-dom ships vitest-5-compatible types.
      - dependency-name: "vitest"
        versions: ["5.x"]
      - dependency-name: "@vitest/coverage-v8"
        versions: ["5.x"]
