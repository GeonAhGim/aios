name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d aios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/aios_test
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/aios_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and quality dependencies
        run: python -m pip install -e ".[test,dev]"

      - name: Apply test database migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      # 08_test_plan §8.7 — .aios-zone 매니페스트 검증(전수감사 §4에서 실제
      # 경로와 어긋난 FROZEN 패턴이 발견됨). scripts/check_zone_manifest.py 참조.
      - name: Zone manifest
        run: python scripts/check_zone_manifest.py

      # 커버리지는 우선 "측정"만 한다 — 전수감사 §9: 이 프로젝트의 품질 근거가
      # "N passed" 하나뿐이었다. 임계치 게이트(--cov-fail-under)는 첫 측정치를
      # 본 뒤 별도 결정.
      - name: Test
        run: pytest -q --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
