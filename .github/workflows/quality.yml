name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 연속 push 시 이전 실행을 취소해 Actions 분(minute)을 아낀다 — 2026-09-01부터 모든 실행이
# startup_failure(BuildFailed)인 원인이 private repo 무료 분 소진으로 추정됨.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aios_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d aios_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/aios_test
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5432/aios_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks가 커밋 히스토리 전체를 스캔하려면 얕은 clone이면 안 됨

      # 레드팀 감사(docs/RED_TEAM_FINDINGS.md #10 — SecretBundle이 model_dump()
      # 경로로 시크릿을 평문 반환하던 문제) 이후, 코드 자체의 취급뿐 아니라
      # 커밋에 시크릿이 실수로 섞여 들어가는 것도 CI에서 막는다. 다른 단계보다
      # 먼저 돌려 시크릿 유출이 있으면 나머지 단계를 낭비하지 않고 즉시 실패.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and quality dependencies
        run: python -m pip install -e ".[test,dev]"

      - name: Apply test database migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src

      # 08_test_plan §8.7 — .aios-zone 매니페스트 검증(전수감사 §4에서 실제
      # 경로와 어긋난 FROZEN 패턴이 발견됨). scripts/check_zone_manifest.py 참조.
      - name: Zone manifest
        run: python scripts/check_zone_manifest.py

      # 커버리지는 우선 "측정"만 한다 — 전수감사 §9: 이 프로젝트의 품질 근거가
      # "N passed" 하나뿐이었다. 임계치 게이트(--cov-fail-under)는 첫 측정치를
      # 본 뒤 별도 결정.
      - name: Test
        run: pytest -q --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # Meta-Control Plane Guard — 에이전트 통제 밖(aios-meta 저장소, 사람만 수정)에서
  # 정의된 Architecture/Security Guard를 이 저장소의 변경 범위에 실행한다.
  # ref가 없으면 실패한다(건너뛰지 않음).
  # 설정 절차: aios-meta/SETUP_PROTECTION.md
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require pinned guard ref
        env:
          META_GUARDS_REF: ${{ vars.META_GUARDS_REF }}
        run: test -n "$META_GUARDS_REF" || { echo "META_GUARDS_REF variable 없음 (aios-meta 고정 커밋 SHA)"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: GeonAhGim/aios-meta    # public — 토큰 불필요
          ref: ${{ vars.META_GUARDS_REF }}
          path: .meta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run guards on change range
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
          python .meta/guards/run_guards.py --repo . --base "$BASE" --head HEAD --json guard-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-report
          path: guard-report.json
