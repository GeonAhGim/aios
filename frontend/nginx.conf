# H-6(ADR-2026-09-09-B) -- nginx-unprivileged 기준(비루트, 8080 listen).
# /healthz는 정적 파일 서빙과 무관한 별도 location -- SPA fallback보다 먼저 매치시켜
# 컨테이너 헬스체크가 index.html 렌더링 여부와 무관하게 프로세스 생존만 확인하게 한다.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
