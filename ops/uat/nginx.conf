server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — 모든 경로를 index.html로 돌려 React Router가 처리하게 함
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 정적 파일(assets/)은 짧게 캐시
    location /assets/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # index.html과 서비스워커는 항상 새로 고침
    location = /index.html {
        add_header Cache-Control "no-cache, no-store";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;
}
