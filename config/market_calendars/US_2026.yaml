# config/market_calendars/US_2026.yaml
#
# source: NYSE(뉴욕증권거래소) 공식 휴장일·조기폐장 캘린더 —
# https://www.nyse.com/markets/hours-calendars (task-1768, decision,
# ADR-2026-09-06-H D3). NASDAQ도 동일 캘린더를 따르므로(KNOWN_SESSIONS의
# KIS_US 세션 스펙 주석 참고) `Venue.KIS_US` 하나로 등재한다.
